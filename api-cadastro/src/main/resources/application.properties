# Nome do Microserviço
spring.application.name=api-cadastro

# Configuração coringa do Host (aceita Docker ou Local)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}

# Ativa o mecanismo de tentativas de conexão no BOOT da aplicação
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=3000ms
spring.rabbitmq.template.retry.max-attempts=6
spring.rabbitmq.template.retry.multiplier=1.5

# Conexão com o PostgreSQL das Notificações (Porta 5433)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5433/db_cadastro
spring.datasource.username=gabriel
spring.datasource.password=adminpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Conexão com o Servidor do RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Força o Spring a tentar se conectar ao RabbitMQ novamente se ele falhar no boot
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=3000ms